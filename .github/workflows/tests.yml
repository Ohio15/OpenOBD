name: Tests

# The release test gate (docs/RELEASE.md step 3) on every PR and every push to
# main: the pytest suite, then the offscreen GUI smoke. Before this workflow
# both ran only in the local pre-commit hook, so a PR from a checkout without
# the hook (or a --no-verify commit) reached main with nothing having run.
#
# The commands are the RELEASE.md ones verbatim, with `python` in place of
# `.venv\Scripts\python.exe`. Python matches the release .venv's major.minor
# (3.13) and the dependencies are requirements.txt's exact pins, so CI tests
# what the exe is built from.
#
# Unknown is never clean: no continue-on-error anywhere, and the summary job
# fails unless every matrix leg SUCCEEDED (skipped or cancelled is not green).
# The summary is the single context to mark required in branch protection.
#
# Runners are GitHub-hosted literals only. This runs PR-controlled code, and no
# self-hosted runner may serve a public repository (see security-audit.yml).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Let both legs finish: an OS-specific failure should not hide the other.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      # SHA-pinned, same refs as security-audit.yml (mutable tags are a
      # supply-chain vector).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; keep the token out of reach of PR code.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      # PySide6's offscreen platform still loads EGL/GL, xkbcommon, fontconfig
      # and glib; a bare Ubuntu runner is not guaranteed to carry all of them.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0t64

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt

      - name: pytest
        shell: bash
        run: python -m pytest tests/ -q

      - name: GUI smoke (offscreen)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_gui.py

  summary:
    name: Tests summary (always runs)
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          echo "## Tests: $TEST_RESULT" >> "$GITHUB_STEP_SUMMARY"
          # needs.<matrix job>.result is success only if every leg succeeded.
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::the test matrix did not succeed ('$TEST_RESULT'); see the per-OS jobs"
            exit 1
          fi
